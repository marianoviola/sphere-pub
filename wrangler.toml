# sphere.pub — a Sphere Node instance built from the @sphere-pub/node package.
#
# Everything node-specific (routes, schema, migrations) comes from the package;
# this file only holds this deployment's identity, vars, and resource bindings.
# Code references BINDING names (SPHERE_DB, SPHERE_CONTENT, SPHERE_CACHE).

name = "sphere-node-pub"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
SPHERE_PUBLISHER_NAME = "Sphere"
SPHERE_PUBLISHER_SUMMARY = "Agent-readable publishing, served by its own node"
SPHERE_PUBLISHER_URL = "https://marianoviola.com"
SPHERE_PUBLISHER_ICON = "https://sphere.pub/assets/sphere-mark.svg"
SPHERE_DEFAULT_LICENSE = "CC-BY-NC"
SPHERE_ALLOW_AI_TRAINING = ""

# SPHERE_OWNER_TOKEN is a SECRET, never a var and never committed:
#   wrangler secret put SPHERE_OWNER_TOKEN

[[d1_databases]]
binding = "SPHERE_DB"
database_name = "sphere-node-db"
database_id = "e8a5b0c6-7700-4a5d-8874-3f6f58ec4576"
# The schema ships with the package; no local migrations directory.
migrations_dir = "node_modules/@sphere-pub/node/migrations"

[[r2_buckets]]
binding = "SPHERE_CONTENT"
bucket_name = "sphere-node-content"

[[kv_namespaces]]
binding = "SPHERE_CACHE"
id = "57c35d5912cd41e38208ffb2337efa3e"
